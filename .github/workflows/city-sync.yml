name: Commit City Automated Sync & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every 6 hours to sync open source developer telemetry
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_username:
        description: 'Specific GitHub username to sync and verify'
        required: false
        default: 'torvalds'

jobs:
  sync-city-registry:
    name: Sync Live Open Source Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Live GitHub Telemetry Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Syncing open-source developer metrics..."
          node -e "
            const https = require('https');
            const target = '${{ github.event.inputs.target_username || 'torvalds' }}';
            const options = {
              hostname: 'api.github.com',
              path: '/users/' + target,
              headers: {
                'User-Agent': 'CommitCity-Actions-Sync',
                ...(process.env.GITHUB_TOKEN ? { 'Authorization': 'Bearer ' + process.env.GITHUB_TOKEN } : {})
              }
            };
            https.get(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                const user = JSON.parse(data);
                console.log('✓ Successfully synced @' + target + ' (Repos: ' + user.public_repos + ', Followers: ' + user.followers + ')');
              });
            }).on('error', (e) => {
              console.error('Sync warning:', e.message);
            });
          "

      - name: Build 3D City Engine
        run: npm run build

      - name: Status Report
        run: echo "Commit City 3D build verified and ready with live telemetry."
